<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ניהול בקשות הנחה — חיידר מעלה עמוס</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { background: #f4f6f9; font-family: Heebo, Arial, sans-serif; }
  .navbar { background: #0d6efd; }
  .brand-logo { height: 36px; margin-left: 8px; border-radius: 6px; background: #fff; padding: 3px; }
  .card { border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.05); border: none; margin-bottom: 16px; }
  .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
  .status-התקבל { background: #fef3c7; color: #92400e; }
  .status-מאושר { background: #d1fae5; color: #065f46; }
  .status-נדחה { background: #fee2e2; color: #991b1b; }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  #login-pane { max-width: 400px; margin: 80px auto; }
  .stat-card { text-align: center; padding: 20px; }
  .stat-card .n { font-size: 32px; font-weight: 800; color: #0d6efd; }
  .stat-card .l { color: #64748b; font-size: 14px; }
  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .card { box-shadow: none; border: 1px solid #ddd !important; page-break-inside: avoid; }
  }
</style>
</head>
<body>

<nav class="navbar navbar-dark mb-4 no-print">
  <div class="container">
    <span class="navbar-brand"><img src="img/logo.png" alt="לוגו" class="brand-logo"> ניהול בקשות הנחה</span>
    <div>
      <button class="btn btn-sm btn-outline-light" onclick="loadRequests()"><i class="bi bi-arrow-clockwise"></i> רענן</button>
      <a href="takanot-hanacha.html" class="btn btn-sm btn-outline-light" target="_blank"><i class="bi bi-box-arrow-up-left"></i> צפייה בטופס</a>
    </div>
  </div>
</nav>

<div class="container">

  <!-- ההתחברות עברה למערכת (Supabase Auth) — RLS מגן בצד-שרת, אין יותר PIN כאן -->
  <div id="login-pane" style="display:none"></div>

  <div id="main-pane" style="display:none;">

    <div class="row g-3 mb-3">
      <div class="col-md-3"><div class="card stat-card"><div class="n" id="stat-total">-</div><div class="l">סה״כ בקשות</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="n" id="stat-pending">-</div><div class="l">ממתין</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="n" id="stat-approved">-</div><div class="l">אושר</div></div></div>
      <div class="col-md-3"><div class="card stat-card"><div class="n" id="stat-avg">-</div><div class="l">הכנסה נטו ממוצעת</div></div></div>
    </div>

    <div class="card p-3 no-print">
      <div class="d-flex align-items-center gap-2 mb-3 flex-wrap">
        <input class="form-control" id="search-box" placeholder="חיפוש לפי שם / ת״ז / טלפון..." style="max-width:340px;">
        <select class="form-select" id="filter-status" style="max-width:180px;">
          <option value="">כל הסטטוסים</option>
          <option>התקבל</option>
          <option>מאושר</option>
          <option>נדחה</option>
        </select>
        <button class="btn btn-outline-primary" onclick="printSelected()"><i class="bi bi-printer"></i> הדפס נבחרים</button>
        <button class="btn btn-outline-secondary" onclick="exportCSV()"><i class="bi bi-file-earmark-spreadsheet"></i> יצוא</button>
        <div class="ms-auto text-muted small">מסמכים ב-Gmail: <a href="https://mail.google.com/mail/u/0/#search/subject%3A%22%5B%D7%94%D7%A0%D7%97%D7%94%5D%22" target="_blank">[הנחה]</a></div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th><input type="checkbox" onchange="toggleAll(this)"></th>
              <th>מזהה</th>
              <th>שם משפחה</th>
              <th>ת״ז בעל</th>
              <th>טלפון</th>
              <th>נפשות</th>
              <th>הכנסה נטו</th>
              <th>סטטוס</th>
              <th>תאריך</th>
              <th>פעולות</th>
            </tr>
          </thead>
          <tbody id="requests-tbody">
            <tr><td colspan="10" class="text-center text-muted py-4">טוען...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="print-area"></div>

    <div class="card p-3 mt-3 no-print">
      <h5>עריכת טקסט הטופס</h5>
      <p class="small text-muted">הטקסט המקדים שההורים רואים בראש הטופס. לחיצה על שמירה מעדכנת את הטופס באתר.</p>
      <textarea class="form-control" id="cover-editor" rows="4"></textarea>
      <button class="btn btn-primary mt-2" onclick="saveCoverText()"><i class="bi bi-save"></i> שמור טקסט טופס</button>
      <div id="save-status" class="small mt-2"></div>
    </div>

  </div>

</div>

<div id="modal-view" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">פרטי בקשה</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn btn-outline-primary" onclick="printOne(currentReq && currentReq.מזהה_בקשה)"><i class="bi bi-printer"></i> הדפס</button>
        <button class="btn btn-outline-success" onclick="setStatus('מאושר')">אישור</button>
        <button class="btn btn-outline-danger" onclick="setStatus('נדחה')">דחייה</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">סגירה</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- שכבת נתונים מאובטחת (Supabase+RLS) — מחליפה את ה-webhook עם הטוקן החשוף -->
<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script>window.CV3 = window.CV3 || {}; window.CV3.TAKANOT_SB = true;</script>
<script src="js/supabase.js"></script>
<script src="js/takanot-supabase.js"></script>
<script>
let allRows = [];
let currentReq = null;

// האבטחה עברה ל-RLS בצד-שרת: הקריאה נפתחת רק ל-session מאומת של צוות (מנהל/מזכירות).
// אין יותר PIN בצד-לקוח ואין טוקן. המסך פועל כשנפתח בתוך המערכת המחוברת (session נשמר
// ב-localStorage מאותו origin); גישה ישירה ללא התחברות תחזיר רשימה ריקה מ-RLS.
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-pane').style.display = 'none';
  document.getElementById('main-pane').style.display = 'block';
  loadRequests();
});

// מיפוי שורת Supabase (אנגלית) לשמות העבריים שהמסך מרנדר
function mapRow(x) {
  return {
    _id: x.id,
    _docs: x.docs || {},
    'מזהה_בקשה': x.request_code || String(x.id),
    'שם_משפחה': x.family_name, 'שם_בעל': x.husband_name, 'תז_בעל': x.husband_id,
    'שם_אישה': x.wife_name, 'תז_אישה': x.wife_id,
    'טלפון': x.phone, 'מייל': x.email, 'כתובת': x.address,
    'ילדים_json': JSON.stringify(x.children || []),
    'ילדים_תמצית': (x.children || []).map(k => k.name + (k.class ? ` (${k.class})` : '')).join(', '),
    'מספר_נפשות': x.household_size,
    'ברוטו_בעל': x.gross_husband, 'נטו_בעל': x.net_husband,
    'ברוטו_אישה': x.gross_wife, 'נטו_אישה': x.net_wife,
    'ברוטו_סה_כ': x.gross_total, 'נטו_סה_כ': x.net_total,
    'הכנסות_נוספות': x.extra_income,
    'סטטוס': x.status || 'התקבל',
    'תאריך_הגשה': x.created_at,
  };
}

async function loadRequests() {
  const tbody = document.getElementById('requests-tbody');
  tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">טוען...</td></tr>';
  try {
    if (!window.TakanotSB || !window.TakanotSB.enabled()) throw new Error('המערכת עדיין נטענת');
    const rows = await window.TakanotSB.list();
    allRows = rows.map(mapRow);
    renderTable();
    updateStats();
    if (!rows.length) {
      let hasSession = false;
      try { const { data } = await window.sb.auth.getSession(); hasSession = !!(data && data.session); } catch (_) {}
      if (!hasSession) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">כדי לצפות בבקשות יש להיכנס למערכת (התחברות צוות). פתח מסך זה דרך התוכנה.</td></tr>';
      }
    }
  } catch (e) {
    tbody.innerHTML = `<tr><td colspan="10" class="text-danger py-4 text-center">שגיאה בטעינה: ${e.message}</td></tr>`;
  }
}

// פתיחת מסמך מה-Storage הפרטי דרך קישור חתום זמני (האזנה מבוססת data-path, בלי הזרקה)
document.addEventListener('click', function (e) {
  const b = e.target.closest('.btn-doc');
  if (b) openDoc(b.dataset.path);
});
async function openDoc(path) {
  try {
    // הורדה כ-blob דרך ה-API (עוקף חסימת נטפרי על פתיחת קישור חיצוני), ואז הורדה מקומית
    const { blob, name } = await window.TakanotSB.download(path);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { alert('שגיאה בהורדת המסמך: ' + e.message); }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function filteredRows() {
  const q = document.getElementById('search-box').value.trim().toLowerCase();
  const status = document.getElementById('filter-status').value;
  return allRows.filter(r => {
    if (status && r['סטטוס'] !== status) return false;
    if (q) {
      const blob = [r['שם_משפחה'], r['שם_בעל'], r['שם_אישה'], r['תז_בעל'], r['תז_אישה'], r['טלפון']].join(' ').toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function renderTable() {
  const rows = filteredRows();
  const tbody = document.getElementById('requests-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-4">אין בקשות</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(r => {
    const date = r['תאריך_הגשה'] ? new Date(r['תאריך_הגשה']).toLocaleDateString('he-IL') : '';
    const status = r['סטטוס'] || 'התקבל';
    return `<tr data-id="${esc(r['מזהה_בקשה'])}">
      <td><input type="checkbox" class="row-check" value="${esc(r['מזהה_בקשה'])}"></td>
      <td><small>${esc(r['מזהה_בקשה'])}</small></td>
      <td><strong>${esc(r['שם_משפחה'])}</strong></td>
      <td>${esc(r['תז_בעל'])}</td>
      <td>${esc(r['טלפון'])}</td>
      <td class="text-center">${esc(r['מספר_נפשות'])}</td>
      <td>${esc(r['נטו_סה_כ'])} ₪</td>
      <td><span class="status-badge status-${esc(status)}">${esc(status)}</span></td>
      <td>${date}</td>
      <td class="row-actions">
        <button class="btn btn-sm btn-outline-primary btn-open" title="צפייה"><i class="bi bi-eye"></i></button>
        <button class="btn btn-sm btn-outline-secondary btn-print" title="הדפסה"><i class="bi bi-printer"></i></button>
      </td>
    </tr>`;
  }).join('');
  // האזנה מבוססת data-id במקום הזרקת המזהה ל-onclick (מונע XSS דרך מזהה_בקשה מזויף)
  tbody.onclick = function (e) {
    const btn = e.target.closest('button'); if (!btn) return;
    const tr = btn.closest('tr'); if (!tr) return;
    const id = tr.dataset.id;
    if (btn.classList.contains('btn-open')) openReq(id);
    else if (btn.classList.contains('btn-print')) printOne(id);
  };
}

function updateStats() {
  document.getElementById('stat-total').textContent = allRows.length;
  document.getElementById('stat-pending').textContent = allRows.filter(r => (r['סטטוס']||'התקבל') === 'התקבל').length;
  document.getElementById('stat-approved').textContent = allRows.filter(r => r['סטטוס'] === 'מאושר').length;
  const avg = allRows.reduce((s,r) => s + (+r['נטו_סה_כ']||0), 0) / (allRows.length || 1);
  document.getElementById('stat-avg').textContent = Math.round(avg).toLocaleString('he-IL') + ' ₪';
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('search-box')?.addEventListener('input', renderTable);
  document.getElementById('filter-status')?.addEventListener('change', renderTable);
});

function openReq(id) {
  const r = allRows.find(x => x['מזהה_בקשה'] === id);
  if (!r) return;
  currentReq = r;
  const kids = (() => { try { return JSON.parse(r['ילדים_json']||'[]'); } catch { return []; } })();
  document.getElementById('modal-body').innerHTML = detailHTML(r, kids);
  new bootstrap.Modal(document.getElementById('modal-view')).show();
}

function detailHTML(r, kids) {
  const docLabels = { payslip_husband: 'תלוש בעל', payslip_wife: 'תלוש אישה', bank: 'עובר ושב', id_husband: 'ת״ז+ספח בעל', id_wife: 'ת״ז+ספח אישה', extra: 'תלוש נוסף', signature: 'חתימה' };
  const docs = r._docs || {};
  let docsHtml = '';
  Object.keys(docLabels).forEach(slot => {
    (docs[slot] || []).forEach((path, i) => {
      const lbl = docLabels[slot] + ((docs[slot].length > 1) ? ' ' + (i + 1) : '');
      docsHtml += `<button class="btn btn-sm btn-outline-primary m-1 btn-doc" data-path="${esc(path)}"><i class="bi bi-file-earmark-arrow-down"></i> ${esc(lbl)}</button>`;
    });
  });
  if (!docsHtml) docsHtml = '<span class="text-muted">אין מסמכים</span>';
  const _net = +r['נטו_סה_כ'] || 0, _ppl = +r['מספר_נפשות'] || 0;
  const perPerson = _ppl > 0 ? Math.round(_net / _ppl).toLocaleString('he-IL') : '—';
  return `
  <h4>${esc(r['שם_משפחה'])} — ${esc(r['מזהה_בקשה'])}</h4>
  <div class="row g-2 mt-2">
    <div class="col-md-6"><strong>בעל:</strong> ${esc(r['שם_בעל'])} — ת״ז ${esc(r['תז_בעל'])}</div>
    <div class="col-md-6"><strong>אישה:</strong> ${esc(r['שם_אישה'])} — ת״ז ${esc(r['תז_אישה'])}</div>
    <div class="col-md-6"><strong>טלפון:</strong> ${esc(r['טלפון'])}</div>
    <div class="col-md-6"><strong>מייל:</strong> ${esc(r['מייל']) || '—'}</div>
    <div class="col-12"><strong>כתובת:</strong> ${esc(r['כתובת'])}</div>
    <div class="col-12"><strong>ילדים:</strong> ${kids.map(k => esc(k.name) + (k.class?` (${esc(k.class)})`:'')).join(', ') || '—'}</div>
  </div>
  <h5 class="mt-3">הכנסות (נטו)</h5>
  <table class="table table-sm table-bordered">
    <tr><td>הבעל</td><td>${esc(r['נטו_בעל'])} ₪</td></tr>
    <tr><td>האישה</td><td>${esc(r['נטו_אישה'])} ₪</td></tr>
    <tr class="table-info"><th>סה״כ נטו</th><th>${esc(r['נטו_סה_כ'])} ₪</th></tr>
    <tr class="table-warning"><th>הכנסה לנפש</th><th>${perPerson} ₪</th></tr>
  </table>
  ${r['הכנסות_נוספות'] ? `<div><strong>הכנסות נוספות:</strong> ${esc(r['הכנסות_נוספות'])}</div>` : ''}
  <div class="mt-2"><strong>מספר נפשות (כולל ההורים):</strong> ${esc(r['מספר_נפשות'])}</div>
  <div class="mt-3 p-3" style="background:#eff6ff;border-radius:8px;">
    <strong>מסמכים מצורפים</strong> — פתיחה בקישור מאובטח זמני:<br>
    <div class="mt-2">${docsHtml}</div>
  </div>`;
}

function printOne(id) {
  const r = allRows.find(x => x['מזהה_בקשה'] === id);
  if (!r) return;
  const kids = (() => { try { return JSON.parse(r['ילדים_json']||'[]'); } catch { return []; } })();
  const area = document.getElementById('print-area');
  area.innerHTML = `<div class="card p-4">${detailHTML(r, kids)}</div>`;
  window.print();
}

function printSelected() {
  const ids = [...document.querySelectorAll('.row-check:checked')].map(cb => cb.value);
  if (!ids.length) { alert('בחר לפחות בקשה אחת'); return; }
  const area = document.getElementById('print-area');
  area.innerHTML = ids.map(id => {
    const r = allRows.find(x => x['מזהה_בקשה'] === id);
    if (!r) return '';
    const kids = (() => { try { return JSON.parse(r['ילדים_json']||'[]'); } catch { return []; } })();
    return `<div class="card p-4" style="page-break-after:always;">${detailHTML(r, kids)}</div>`;
  }).join('');
  window.print();
}

function toggleAll(cb) {
  document.querySelectorAll('.row-check').forEach(c => c.checked = cb.checked);
}

async function setStatus(newStatus) {
  if (!currentReq) return;
  if (!confirm(`לשנות סטטוס ל: ${newStatus}?`)) return;
  try {
    await window.TakanotSB.updateStatus(currentReq._id, newStatus);
    currentReq['סטטוס'] = newStatus;
    await loadRequests();
    bootstrap.Modal.getInstance(document.getElementById('modal-view'))?.hide();
  } catch (e) { alert('שגיאה: ' + e.message); }
}

function exportCSV() {
  const rows = filteredRows();
  if (!rows.length) { alert('אין נתונים ליצוא'); return; }
  const cols = ['מזהה_בקשה','שם_משפחה','שם_בעל','תז_בעל','שם_אישה','תז_אישה','טלפון','כתובת','ילדים_תמצית','נטו_בעל','נטו_אישה','נטו_סה_כ','מספר_נפשות','סטטוס','תאריך_הגשה'];
  // csvCell: מקדים ' לתא שמתחיל ב-= + - @ (מונע הרצת נוסחאות באקסל — CSV injection דרך קלט הורים)
  const csvCell = v => { v = String(v == null ? '' : v); if (/^[=+\-@\t\r]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
  const csv = [cols.map(csvCell).join(','), ...rows.map(r => cols.map(c => csvCell(r[c])).join(','))].join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `בקשות_הנחה_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

const DEFAULT_COVER = 'טופס זה מיועד להורים המבקשים לקבל אישור על זכאות להנחה בשכר לימוד מהמועצה האזורית. הפרטים והמסמכים שיוגשו נשמרים במערכת סגורה, נבדקים ע"י המזכירות ומועברים בצורה מרוכזת למועצה. אין מדובר בשליחה גלויה למזכירות בלבד — המידע נשמר ומועבר בצורה רשמית.';

document.addEventListener('DOMContentLoaded', () => {
  const stored = localStorage.getItem('takanot_cover_text') || DEFAULT_COVER;
  const ed = document.getElementById('cover-editor');
  if (ed) ed.value = stored;
});

function saveCoverText() {
  const text = document.getElementById('cover-editor').value.trim();
  localStorage.setItem('takanot_cover_text', text);
  document.getElementById('save-status').innerHTML = '<span class="text-success">נשמר מקומית. לעדכון גלובלי — יש לערוך את הטופס בגיטהאב.</span>';
}
